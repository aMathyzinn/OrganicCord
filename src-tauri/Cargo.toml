[package]
name = "organic-cord"
version = "0.2.0-beta.1"
description = "OrganicCord - Multi-account Discord client"
authors = ["OrganicCord"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.89"

[lib]
name = "organic_cord_lib"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "organic-cord"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-store = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart", "stream"], default-features = false }
keyring = { version = "3", features = ["windows-native"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
rand_10 = { package = "rand", version = "0.10" }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "1"
once_cell = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
sha2 = "0.10"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
rsa = { package = "sad-rsa", version = "0.10.2", features = ["sha2"] }
spki = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
tauri-plugin-dialog = "2.7.1"
async-stream = "0.3.6"
bytes = "1.12.0"
davey = "0.1.4"
cpal = "0.17.1"
opus = "0.4.0"
urlencoding = "2.1"
nnnoiseless = { version = "0.5.2", default-features = false }
sysinfo = "0.30.13"
zeroize = "1"
webrtc = "0.14"
webrtc-media = "0.11"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com"] }
webview2-com = "0.38.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
# hpke-rs 0.6.1 depends on vulnerable libcrux SHAKE primitives even when the
# RustCrypto backend is selected. This source-identical patch swaps only those
# two SHAKE-256 calls for the RustCrypto `sha3` implementation and removes the
# unused optional libcrux backend. See vendor/hpke-rs/PATCH.md.
hpke-rs = { path = "vendor/hpke-rs" }
